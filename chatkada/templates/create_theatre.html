{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="create-theatre-container">
    <div class="create-theatre-form">
        <h1><i class="fas fa-film"></i> Create Theatre Room</h1>
        <p>Start a movie night or watch live TV with up to 10 friends</p>
        
        <form method="post" action="{% url 'create_theatre_room' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="theatre_name">Theatre Name:</label>
                <input type="text" name="theatre_name" id="theatre_name"
                    placeholder="e.g., Movie Night, Live Sports..." maxlength="50" required>
            </div>
            
            <div class="form-group">
                <label for="channel_url">Initial Channel URL (optional):</label>
                <input type="url" name="channel_url" id="channel_url"
                    placeholder="https://example.com/stream.m3u8">
                <small>You can also select a channel after creating the room</small>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-play"></i> Create Theatre
            </button>
            <a href="{% url 'find_chat' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </form>
    </div>
</div>

<style>
    .create-theatre-container {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2rem;
    }
    
    .create-theatre-form {
        background: var(--surface-color);
        padding: 2rem;
        border-radius: var(--border-radius);
        border: 1px solid var(--border-color);
    }
    
    .create-theatre-form h1 {
        color: var(--primary-color);
        margin-bottom: 0.5rem;
    }
    
    .create-theatre-form p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-color);
        font-weight: 500;
    }
    
    .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        background: var(--background-color);
        color: var(--text-color);
    }
    
    .form-group small {
        display: block;
        margin-top: 0.25rem;
        color: var(--text-secondary);
        font-size: 0.85rem;
    }
    
    .btn {
        margin-right: 0.5rem;
    }
</style>
{% endblock %}
